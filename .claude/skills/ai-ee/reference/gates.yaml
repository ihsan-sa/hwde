# Pipeline gates - machine pass/fail criteria evaluated by scripts/gate.py.
#
# A gate names a kicad-cli report to run (via kc.py) and the criteria that make
# it pass. The orchestrator (SPEC.md sections 3-4) runs a gate at each [G] edge;
# on pass it git-commits (gate.py --commit), on fail it clusters violations and
# dispatches fixers, then re-runs the same gate.
#
# Gate fields:
#   phase        pipeline phase this gate guards (documentation)
#   tool         kc.py report to run: "erc" (needs a .kicad_sch) or
#                "drc" (needs a .kicad_pcb)
#   drc_options  for tool: drc - {parity, all_track_errors, require_fresh_fills}
#                (all default false; gates never refill/save, so evaluation
#                cannot mutate the board). require_fresh_fills: refuse (exit 2)
#                on stale/unfilled zones instead of grading phantom clearance
#                errors (T6; set on drc_routed - the P6 interim gate may
#                legitimately see boards whose zones predate filling).
#   fail_severities  severities that count toward failure (default [error]).
#                    "clean" gates include warning.
#   max_count    max counted violations allowed to still pass (default 0)
#   description  one line
#
# Evaluation: a gate FAILS when the number of violations whose severity is in
# fail_severities exceeds max_count. Those are echoed in the gate result as
# `failing` (with coordinates) for the fixer dispatch.
#
# S2 defined erc/drc/drc_routed; S5 added verify (verify_all.py aggregate);
# S9 adds place (place_metrics.py legality: courtyard overlaps, declared-edge
# compliance, keepouts, decoupler distance - the P6 fast-route-completion term
# arrives with S10/S11 route feedback); S12 adds dfm (dfm_check.py); post-v1
# adds sim (sim_run.py: SPICE testbench bounds via the KiCad-bundled ngspice).
# routed (P7 "100% routed") is covered by drc_routed's parity + unconnected.
#
# The `verify` gate's tool is "verify": gate.py runs verify_all.py on the board,
# taking constraints.json / decoupling.json from the board's own directory. Its
# merged summary carries the same {violations, counts} shape the erc/drc gates
# produce, so evaluate() gates it identically (fail on error-severity).
#
# The `sim` gate's input is a DIRECTORY (unlike every other gate): the
# workspace kicad/sims/ holding the sim-analyst's testbench .cir files with
# their .bounds.json sidecars. gate.py runs sim_run.py over it; the report
# carries the same {violations, counts} shape, so evaluate() gates it
# identically (fail on error-severity: sim_bound_fail / sim_measure_missing
# at error, and any sim_engine_error).

version: 1

gates:
  erc:
    phase: P4
    tool: erc
    fail_severities: [error, warning]   # SPEC P4: ERC "must be clean"
    max_count: 0
    description: Schematic ERC clean (errors and warnings; waivers are manual).

  drc:
    phase: P6
    tool: drc
    # parity: true since T6 (ladder row 122): a symbol/footprint mismatch
    # introduced by P4-P6 edits must surface BEFORE routing - drc_routed
    # finding it first costs a full re-route cycle. A placed-unrouted board's
    # unconnected items are warnings and do not fail this [error]-only gate.
    drc_options: {parity: true, all_track_errors: false}
    fail_severities: [error]
    max_count: 0
    description: Board DRC has no error-level violations (interim placement gate).

  drc_routed:
    phase: P7
    tool: drc
    drc_options: {parity: true, all_track_errors: true, require_fresh_fills: true}
    fail_severities: [error, warning]
    max_count: 0
    description: >-
      Fully routed and clean: DRC + schematic parity + all track errors, zero
      violations at any severity (SPEC P7 "100% routed, DRC=0").

  place:
    phase: P6
    tool: place
    fail_severities: [error]
    max_count: 0
    description: >-
      Placement legality (place_metrics.py): no courtyard overlaps, declared
      connectors on their edges, keepouts respected, decoupler distances in
      class limits. Warnings (missing courtyards) surface without failing.

  verify:
    phase: P8
    tool: verify
    fail_severities: [error]
    max_count: 0
    description: >-
      P8 verification suite (verify_all.py): return path, current, decoupling,
      diff pairs, creepage, thermal, silk, PDN. Fails on any error-severity
      finding; warnings are surfaced for human review, not auto-failed.
      Human-approved residuals can be waived via the verify-waivers.json
      sidecar (gate.py --waivers; every entry needs reason + approved) so a
      board with justified exceptions can record a true pass (T6; the carrier
      shipped with gates.verify permanently 'fail').

  sim:
    phase: P8
    tool: sim
    fail_severities: [error]
    max_count: 0
    description: >-
      SPICE behavioral gate (sim_run.py): every testbench in the input sims
      directory runs through the KiCad-bundled ngspice shared library and
      each measured value must sit inside its authored .bounds.json window.
      Catches the wrong-value defect class (a 47k where 4.7k belongs) that
      ERC/DRC/verify/DFM are all blind to. Warning bounds surface without
      failing; an engine crash, timeout or missing measure behind an
      error-severity bound fails the gate.

  dfm:
    phase: P9
    tool: dfm
    fail_severities: [error]
    max_count: 0
    description: >-
      Local DFM on the EXPORTED gerbers (dfm_check.py, gerbonara): trace width,
      clearance, drill, annular ring, hole/copper to edge, silk over pad, and
      CPL polarity vs the schematic (the catcher for a polarized part mounted
      backwards, which net-level schematic parity misses). Advisory classes -
      KiCad's stock 0.12 mm silk, tight mask dams, missing LCSC numbers - are
      warnings and do not fail the gate. JLCDFM's own 30+ checks are a separate,
      semi-manual second opinion (no public API).
