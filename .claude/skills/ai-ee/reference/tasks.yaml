# tasks.yaml - the task taxonomy: what an EE can be asked to do, and the recipe
# that does it (T10).
#
# Consumed by scripts/task_router.py: `/ai-ee <task>` matches this table FIRST
# (deterministic regex), and only an ambiguous/unknown match falls through to
# LLM classification (which lands back here via --verb). The full pipeline is
# the `full-run` verb - a recipe like any other, not a separate code path.
#
# A recipe is: steps (scripts / agents / gates / human holds) + the edit class
# the work belongs to. Gates and ceremony are NOT restated here: a verb names
# its `edit_class` and the router reads reference/invalidation.yaml for the
# gates to re-run and the human_hold weight (T7). Restating them is how the two
# files drift apart, so the schema forbids it (a verb with an edit_class may not
# carry a `gates:` key; test_task_router pins that).
#
# Step forms (exactly one key per step, plus the shared `why`):
#   do:     "scripts/x.py --flag {slot}"  a concrete command; {slots} bind from
#           the workspace + extracted args (see PLACEHOLDERS below). Unbound
#           required slots become plan `needs` and block the plan (exit 1).
#   gate:   <name from gates.yaml>        run it via gate.py; the router appends
#           every remaining mapped gate after the last step, so a recipe only
#           lists a gate when its ORDER inside the recipe matters.
#   agent:  <role in agents/>             spawn it; `tier` is the SKILL.md
#           spawn tier for this role in this recipe.
#   human:  <0-3>                         a hold; see invalidation.yaml weights.
#   recipe: <verb>                        run that recipe here (composition).
#   note:   "..."                         judgment the orchestrator must apply;
#           the long form lives in the verb's doc.
# Optional per step: `when` (free text condition - the orchestrator judges),
# `optional: true`.
#
# PLACEHOLDERS bound by the router:
#   workspace slots  {ws} {board} {pcb} {sch} {netlist} {pro} {dru}
#                    {constraints} {decoupling} {parts} {sims} {fab} {reports}
#                    {log} {state}
#     - every kicad/ path resolves through statelib.kind_path (invalidation.yaml
#       artifact_kinds + the workspace's own registry overrides), never by
#       string-building a layout this repo happens to use.
#   arg slots        declared per verb under `args`; extracted from the task
#                    text (refdes / net / path / lcsc / int) or passed
#                    --arg name=value.
#   {work}           a scratch path the orchestrator picks for op lists etc.
#
# preconditions (checked against the workspace when one is given; a failed
# precondition marks the plan `blocked` with the reason, exit 1):
#   workspace          a state.json must exist
#   board_exists       the .kicad_pcb must exist
#   sch_exists         the .kicad_sch must exist
#   netlist_exists     the exported netlist must exist
#   gates_fresh:<g>    gate <g> must be pass AND hash-fresh AND unmarked (T7)
#   no_open_issues     no open/fixing issues in state.json
#
# Adding a verb: add it here + reference/recipes/<verb>.md. The tests enforce
# that every script/flag/agent/gate/edit_class named here exists.

version: 1

verbs:

  # -------------------------------------------------------------------------
  review:
    summary: Review an existing board - import it into a workspace and run every
      gate as a baseline, or re-review a workspace already here.
    doc: reference/recipes/review.md
    workspace: created
    edit_class: null
    gates: []          # intake RECORDS baselines; it does not re-run gates
    human_hold: 2
    args:
      source: {kind: path, required: false,
               question: "Path to the KiCad project directory or .kicad_pro to review?"}
    match:
      any: ['\breview\b', '\baudit\b', '\bintake\b', '\bimport (this|a|the|my)\b',
            '\btake over\b', '\bsecond opinion\b', '\bsanity[- ]check\b',
            '\b(look|take a look) at (this|my|the) (board|design|project)\b',
            '\bcritique\b', '\bassess\b', '\bwhat.s wrong with\b']
      not: ['\bdfm\b', '\bmanufactur', '\bfabricab']
    variants:
      external:
        when: has_arg:source
        steps:
          - do: "scripts/intake.py --source {source} --workspace {ws} --board {board} --out {reports}/intake.json"
            why: "copy-in (source never mutated, sha256-verified), format-pin
                  upgrade, state v2 init at the design's real phase, baseline
                  erc/drc_routed/verify/dfm, netlist audit, renders, digest"
          - note: "Read {reports}/intake-digest.md - the gate table and
                   `next_actions` ARE the review. A failing gate is the board's
                   finding, not an intake failure (intake exits 0 for it)."
          - note: "verify checks reported `skipped` were not run (no constraints
                   sidecar) - say so; do not report them as passes."
          - agent: verify-reviewer
            tier: fable/high
            why: "fresh-context judgment over the digest + renders + verify_all.json"
          - human: 2
            why: "present the digest + design doc; ask which findings to fix"
          - note: "Each accepted finding becomes a `fix-finding` run against its
                   gate report; parts/footprint findings become `make-footprint`."
      workspace:
        when: has_workspace
        gates: [erc, drc_routed, verify, dfm]   # re-established, not assumed
        steps:
          - do: "scripts/state.py resume --workspace {ws}"
            why: "phase, gates, freshness (gates_stale / gates_freshness_unknown)"
          - gate: erc
            why: "re-establish every gate against the CURRENT files BEFORE the
                  reviewer reads them - a stale pass is not evidence"
          - gate: drc_routed
          - gate: verify
          - gate: dfm
          - do: "scripts/render.py {pcb} --views top,bottom --out-dir {reports}"
            why: "the reviewer needs pictures, not s-expressions"
          - agent: verify-reviewer
            tier: fable/high
            why: "fresh context over verify_all.json + renders"
          - do: "scripts/report_gen.py --workspace {ws}"
            why: "living design doc; non-blocking by contract"
          - human: 2
            why: "present findings; ask which to fix"

  # -------------------------------------------------------------------------
  fix-finding:
    summary: Fix violations from a gate result or check report through the
      standard dispatch -> fixer -> re-gate loop.
    doc: reference/recipes/fix-finding.md
    workspace: required
    edit_class: null      # the fix's own class depends on the domain - see doc
    gates: []             # the failing gate re-runs; the doc's table adds the rest
    human_hold: 0
    args:
      findings: {kind: path, required: true,
                 question: "Which report holds the findings? (a gate result or a
                            check report JSON, e.g. reports/gate-verify.json)"}
      gate: {kind: text, required: false, extract: none,
             question: "Which gate failed?"}
    preconditions: [workspace, board_exists]
    match:
      any: ['\bfix\b', '\brepair\b', '\bclear\b', '\bviolations?\b', '\bfindings?\b',
            '\b(drc|erc|verify|dfm) (errors?|warnings?|failures?)\b',
            '\bfailing gate\b', '\bwork ?order\b', '\bmake .* (pass|clean)\b',
            '\bgate .* (fails?|failed|failing)\b']
      not: ['\bfootprint\b']
    steps:
      - do: "scripts/state.py budget --workspace {ws} --path fix_loops.{gate} --consume"
        why: "exit 2 = budget exhausted -> ESCALATE, never loop again"
      - do: "scripts/state.py snapshot --workspace {ws} --label pre-fix-{gate} --files kicad/{board}.kicad_pcb"
        why: "the rollback point; add the .kicad_sch for P4-phase fixes"
      - do: "scripts/fix_dispatch.py --input {findings} --board {pcb} --state {state} --out {log}/dispatch.json"
        why: "clusters by (net, kind, region), writes one work order per cluster
              WITH its reference/remediations/<kind>.md paths, registers open issues"
      - agent: fixer
        tier: opus/high
        why: "one per work order; orders inside one `parallel_groups` entry may
              run concurrently, groups run in sequence. Copper/route fixers are
              opus/high; silk/sch/parts/fab fixers are sonnet/medium."
      - do: "scripts/state.py edit --workspace {ws} --class {edit_class} --what {ref} --why \"fix {gate}\""
        why: "declare what the fix actually changed - the doc's domain->class
              table; this is what stamps the derived artifacts stale"
      - gate: "{gate}"
        why: "re-run the gate that failed; record EVERY attempt (record-gate)"
      - note: "A fixer that introduced NEW violations: restore its snapshot, mark
               the issue escalated, continue with the rest."
      - note: "After any copper/placement fix re-run drc_routed BEFORE verify -
               fixes must not regress an earlier gate."

  # -------------------------------------------------------------------------
  move:
    summary: Move / rotate / flip a placed footprint (or a refdes label) on the board.
    doc: reference/recipes/move.md
    workspace: required
    edit_class: move_fp
    args:
      ref: {kind: refdes, required: true, extract: first,
            question: "Which refdes should move (e.g. C12)?"}
    preconditions: [workspace, board_exists]
    match:
      any: ['\bmove\b', '\bnudge\b', '\bshift\b', '\brelocate\b', '\breposition\b',
            '\brotate\b', '\bflip\b', '\bcloser to\b', '\bfurther from\b',
            '\bto the (other|back|top) side\b']
      not: ['\bmove (on|to) (the )?next (phase|step)\b']
    variants:
      silk:
        when: 'matches:\b(refdes|silkscreen|silk|label|designator|value text|text)\b'
        edit_class: silk_edit
        steps:
          - do: "scripts/silk_place.py --pcb {pcb} --refs {ref} --apply --verify-drc --out-report {reports}/silk_place.json"
            why: "the solver places pin-locked labels legally; --apply writes via
                  place_edit move_text. Hand-written ops only when it refuses."
          - do: "scripts/state.py edit --workspace {ws} --class silk_edit --what {ref} --why \"label move\""
            why: "hold 0 - cosmetics; the gates are the whole story"
      footprint:
        when: always
        steps:
          - do: "scripts/state.py snapshot --workspace {ws} --label pre-move-{ref} --files kicad/{board}.kicad_pcb"
            why: "atomic rollback point (place_edit is atomic per invocation, the
                  re-route that follows is not)"
          - do: "scripts/place_edit.py --pcb {pcb} --ops {work}/ops.json --allow-routed --out-report {reports}/place_edit.json"
            why: 'ops = {"version":1,"ops":[{"op":"move","ref":"{ref}","x":X,"y":Y}]}
                  (also rotate/flip/lock); absolute coordinates, idempotent'
          - note: "--allow-routed leaves the OLD copper where it was: the moved
                   pads keep their tracks only by accident. Rip and re-route the
                   affected nets (`reroute-net`) before believing drc_routed."
          - do: "scripts/state.py edit --workspace {ws} --class move_fp --what {ref} --why \"placement change\""
            why: "stamps place/drc/drc_routed/verify/dfm + the gerber zip stale"
          - note: "Zones: any copper edit stales the pours - refill before gating
                   (kc.py drc --refill --save-board is the only headless
                   filler at this pin - kicad-cli's own flag is --refill-zones)."
          - note: "Neighbour silk does NOT move with the footprint - check_silk
                   fires in verify, not DRC."

  # -------------------------------------------------------------------------
  swap-part:
    summary: Swap a part's value/MPN (same footprint) or replace it with a
      different package.
    doc: reference/recipes/swap-part.md
    workspace: required
    edit_class: swap_part_same_fp
    args:
      ref: {kind: refdes, required: true, extract: first,
            question: "Which refdes is being swapped (e.g. R5)?"}
      lcsc: {kind: lcsc, required: false,
             question: "Which LCSC part number replaces it (e.g. C25804)?"}
    preconditions: [workspace, sch_exists, board_exists]
    match:
      any: ['\bswap\b', '\breplace\b', '\bsubstitute\b', '\bchange\b.*\b(value|part|mpn|component|to a)\b',
            '\bdifferent (part|value|mpn)\b', '\bsecond source\b', '\bre-?spec\b']
      not: ['\bfootprint\b']
    steps:
      - do: "scripts/parts_search.py --query {lcsc} --basic-only --min-stock 1000 --out {ws}/parts/candidates.json"
        why: "Basic-first, in-stock: an Extended part costs a feeder"
        optional: true
        when: "the replacement part is not already sourced"
      - agent: schematic-block
        tier: fable/medium
        why: "edit the symbol's Value/MPN/LCSC fields (schlib.py); footprint field
              too if the package changes - that makes it swap_part_new_fp"
      - gate: erc
        why: "the schematic changed; ERC is errors AND warnings = 0"
      - do: "scripts/kc.py netlist {sch} --out {netlist}"
        why: "board_update diffs THIS netlist against the board"
      - do: "scripts/board_update.py --pcb {pcb} --netlist {netlist} --dry-run --out-report {reports}/board_update-dry.json"
        why: "classification first: plan.swap_same_fp vs plan.swap_new_fp vs
              plan.unsupported (exit 1 = unsupported changes present)"
      - do: "scripts/board_update.py --pcb {pcb} --netlist {netlist} --state {state} --out-report {reports}/board_update.json"
        why: "same-fp = fields only (geometry byte-stable); new-fp = del+add at the
              old spot, its stubs ripped - re-route them"
      - do: "scripts/bom_cpl.py --pcb {pcb} --parts {parts} --out-dir {fab}"
        why: "BOM/CPL are stale by the map the moment a value changes"
      - do: "scripts/state.py rehash --workspace {ws} --names bom bom_full cpl"
        why: "clear the stale marks you just regenerated - bare rehash keeps them"
      - note: "A new footprint changes the edit class to swap_part_new_fp: more
               gates (place/drc/drc_routed) and re-routing. board_update's report
               tells you which class it actually applied."

  # -------------------------------------------------------------------------
  add-part:
    summary: Add a part (decoupler, clamp, pull-up) to the schematic and the
      placed board without discarding placement or routing.
    doc: reference/recipes/add-part.md
    workspace: required
    edit_class: add_part
    args:
      lcsc: {kind: lcsc, required: false,
             question: "Which LCSC part number (e.g. C14663)?"}
      # extract: none - this names the NEW part; the refdes in "add a cap on
      # U1" is the IC being decoupled, and binding that would be worse than
      # leaving the slot open.
      ref: {kind: refdes, required: false, extract: none,
            question: "Which refdes should the new part get?"}
    preconditions: [workspace, sch_exists]
    match:
      any: ['\badd\b', '\bfit\b', '\bpopulate\b', '\binsert\b', '\bstuff\b',
            '\bput an?\b', '\bneeds? an?\b.*\b(cap|capacitor|resistor|diode|clamp|pull-?up|pull-?down|ferrite|tvs)\b']
      not: ['\badd (a )?(text|label|silk|note|comment)\b', '\bfootprint\b']
    steps:
      - recipe: make-footprint
        why: "only when the part is not already in the project library"
        optional: true
      - agent: schematic-block
        tier: fable/medium
        why: "add the symbol + wiring on the right sheet; keep the refdes free"
      - gate: erc
        why: "a floating pin or missing PWR_FLAG fails here, not later"
      - do: "scripts/kc.py netlist {sch} --out {netlist}"
        why: "the diff board_update applies"
      - do: "scripts/board_update.py --pcb {pcb} --netlist {netlist} --dry-run --out-report {reports}/board_update-dry.json"
        why: "confirms the diff is exactly the add (plan.add) and nothing else"
      - do: "scripts/board_update.py --pcb {pcb} --netlist {netlist} --placements {work}/placements.json --state {state} --out-report {reports}/board_update.json"
        why: 'placements = {"{ref}": {"region":[x1,y1,x2,y2]}} or {"x":..,"y":..};
              the region scan lands it courtyard-legal and clearance-clear, front
              side only. Existing copper is preserved.'
      - note: "The new pads arrive NETTED but unrouted - DRC unconnected items ARE
               the ratsnest. Route them with `reroute-net` / the fix loop."
      - do: "scripts/bom_cpl.py --pcb {pcb} --parts {parts} --out-dir {fab}"
        why: "a new line item in both files"
      - do: "scripts/state.py rehash --workspace {ws} --names bom bom_full cpl"
        why: "the regenerated pair is current again"

  # -------------------------------------------------------------------------
  remove-part:
    summary: Remove a part from schematic + board, taking its now-orphaned copper
      and silk with it.
    doc: reference/recipes/remove-part.md
    workspace: required
    edit_class: del_part
    args:
      ref: {kind: refdes, required: true, extract: first,
            question: "Which refdes should be removed (e.g. C2)?"}
    preconditions: [workspace, sch_exists, board_exists]
    match:
      any: ['\bremove\b', '\bdelete\b', '\bdepopulate\b', '\brip out\b', '\bdrop\b',
            '\bdnp\b', '\bunpopulate\b', '\btake off\b', '\bget rid of\b']
      not: ['\bremove\b.*\b(track|trace|copper|via|stub|silk|label)\b']
    steps:
      - agent: schematic-block
        tier: fable/medium
        why: "delete the symbol and heal the wiring (a dangling wire is an ERC error)"
      - gate: erc
      - do: "scripts/kc.py netlist {sch} --out {netlist}"
      - do: "scripts/board_update.py --pcb {pcb} --netlist {netlist} --dry-run --out-report {reports}/board_update-dry.json"
        why: "read orphans.* BEFORE applying: what copper the delete will take
              (netconn-proven, not proximity) and what pre-existing unanchored
              copper it deliberately KEEPS (baseline-subtracted)"
      - do: "scripts/board_update.py --pcb {pcb} --netlist {netlist} --state {state} --out-report {reports}/board_update.json"
        why: "footprint + orphan stubs + silk inside its bbox go; a DRC dangling
              delta rolls the whole thing back byte-identically"
      - do: "scripts/bom_cpl.py --pcb {pcb} --parts {parts} --out-dir {fab}"
      - do: "scripts/state.py rehash --workspace {ws} --names bom bom_full cpl"
      - note: "Removing a decoupler or a clamp changes the electrical design -
               check_pdn/check_decoupling in verify is the arbiter, not DRC."

  # -------------------------------------------------------------------------
  reroute-net:
    summary: Rip up and re-route a net (or widen/re-path part of one) on a routed
      board.
    doc: reference/recipes/reroute-net.md
    workspace: required
    edit_class: reroute_net
    args:
      net: {kind: net, required: true,
            question: "Which net (e.g. +3V3, /USB_DP)?"}
    preconditions: [workspace, board_exists]
    match:
      any: ['\bre-?route\b', '\broute\b', '\brip ?up\b', '\bre-?wire\b', '\bwiden\b',
            '\bre-?path\b', '\bshorten\b', '\bthicken\b', '\bre-?do the (routing|tracks)\b']
      not: ['\broute (the )?(order|shipment)\b']
    steps:
      - do: "scripts/state.py snapshot --workspace {ws} --label pre-reroute --files kicad/{board}.kicad_pcb"
        why: "route surgery has no undo of its own beyond this"
      - do: "scripts/route_edit.py --pcb {pcb} --ops {work}/ops.json --out-report {reports}/route_edit.json"
        why: 'the ONLY writer for track/via changes outside route_auto: ops =
              remove {uuid} / add_track {start,end,width,layer,net} / add_via
              {at,size,drill,net}. Atomic: any failure leaves the board identical.'
      - do: "scripts/route_critical.py --pcb {pcb} --pad-window --nets {net} --out-report {reports}/pad_window.json"
        why: "diagnostic BEFORE widening: widest connectable track per pad of
              the net vs its DRU floor (exit 1 = geometrically unmeetable, which
              is a placement or pour answer, never a wider track)"
        optional: true
      - do: "scripts/route_critical.py --pcb {pcb} --only power --work-dir {work} --out-report {reports}/route_critical.json"
        why: "re-lay a whole critical CLASS (diff | rf | power, taken from
              constraints.json). NOTE: no script re-routes one NAMED net end to
              end - route_critical's --nets feeds the pad-window probe only, and
              route_auto is the whole-board Freerouting pass."
        optional: true
        when: "the net is a critical-class net and its whole class should be re-laid"
      - note: "Zones stale on every copper edit - refill (kc.py drc --refill
               --save-board) BEFORE drc_routed, which refuses stale fills."
      - do: "scripts/state.py edit --workspace {ws} --class reroute_net --what {net} --why \"re-route\""
        why: "hold 1: gates + a decision line, no checkpoint ceremony"
      - note: "A plane-carried power net is NOT trunk-routed on outer layers - the
               plane IS the trunk (route_critical skips them by design)."

  # -------------------------------------------------------------------------
  make-footprint:
    summary: Get a part into the project library - pull it, fix its silk/refdes,
      and verify the land pattern against the datasheet.
    doc: reference/recipes/make-footprint.md
    workspace: optional
    edit_class: null
    gates: []
    human_hold: 1
    args:
      lcsc: {kind: lcsc, required: true,
             question: "Which LCSC part number (e.g. C5184243)?"}
    match:
      any: ['\bfootprint\b', '\bland pattern\b', '\bsymbol\b', '\blibrary\b',
            '\bkicad_mod\b', '\bpull\b.*\b(part|lcsc|c\d{4,})\b', '\bmake a part\b']
      not: ['\bfootprint\b.*\b(too (big|small)|wrong)\b.*\bfix\b']
    steps:
      - do: "scripts/parts_search.py --query {lcsc} --out {ws}/parts/search.json"
        why: "confirm stock/Basic status before committing the design to it"
        optional: true
      - do: "scripts/lib_pull.py --lcsc {lcsc} --project {ws}/kicad --out {ws}/parts/pull-{lcsc}.json --verify-load --verify-drc"
        why: "easyeda2kicad pull + silk autofix + refdes norm + lib-table
              registration; --verify-drc measures the silk fix with a REAL DRC"
      - do: "scripts/datasheet_extract.py --pdf {ws}/parts/{lcsc}.pdf --out {ws}/parts/{lcsc}-grounding.json"
        why: "per-page text + schema + template for the extractor agent - the
              land pattern must come from the datasheet, never from memory"
        optional: true
      - agent: datasheet-extractor
        tier: sonnet/high
        why: "fills the schema; --validate rejects a bad extraction with paths"
      - do: "scripts/fp_verify.py --footprint {ws}/lib/aiee.pretty/{lcsc}.kicad_mod --datasheet-json {ws}/parts/{lcsc}.json --svg {reports}/{lcsc}-fp.svg"
        why: "pad count / pin 1 / pitch are errors; pad size + missing courtyard
              are warnings. The SVG overlay is for the human, not the gate."
      - agent: librarian
        tier: sonnet/medium
        why: "only for residue the scripts flag (plated pegs, DIP switches,
              exposed pads) - a pad-geometry failure blocks P4"
      - note: "This verb produces a LIBRARY artifact. Putting the part on a board
               is `add-part` / `swap-part`."

  # -------------------------------------------------------------------------
  dfm-check:
    summary: Check manufacturability at JLCPCB - export the fab package and gate
      it locally.
    doc: reference/recipes/dfm-check.md
    workspace: required
    edit_class: null
    gates: [dfm]
    human_hold: 0
    preconditions: [workspace, board_exists]
    match:
      any: ['\bdfm\b', '\bmanufactur', '\bfabricab', '\bfab check\b', '\bgerbers?\b',
            '\bjlc(pcb)?\b.*\b(check|rules?|capab)', '\bcan (this|it) be (made|built|fabbed)\b',
            '\bproduction[- ]ready\b']
    steps:
      - do: "scripts/fab_export.py --pcb {pcb} --out-dir {fab} --out {reports}/fab_export.json"
        why: "Protel extensions + X2, JLC layer set, drill files, zipped"
      - do: "scripts/bom_cpl.py --pcb {pcb} --parts {parts} --out-dir {fab} --out {reports}/bom_cpl.json"
        why: "CPL rotations come from reference/jlc_rotations.csv - the polarized-
              part-mounted-backwards class"
      - gate: dfm
        why: "gate.py re-exports to scratch from the BOARD - the shipped zip is an
              ordering artifact, not a gate input"
      - agent: dfm
        tier: inline-default
        why: "spawn only when a failure needs narrative; the script IS the check"
      - note: "JLCDFM (the fab's own 30+ checks) has no public API - it stays a
               human browser step before ordering."

  # -------------------------------------------------------------------------
  order:
    summary: Quote and order the board at JLCPCB. Real money; always human-gated.
    doc: reference/recipes/order.md
    workspace: required
    edit_class: null
    gates: []
    human_hold: 3
    args:
      qty: {kind: int, required: false, question: "How many boards?"}
    preconditions: [workspace, board_exists, gates_fresh:dfm, no_open_issues]
    match:
      any: ['\border\b', '\bbuy\b', '\bpurchase\b', '\bquote\b', '\bcheckout\b',
            '\bsend .* to (jlc|the fab)\b', '\bget .* made\b', '\bplace the order\b']
      # "where's my order" is tracking, not ordering - \bwhere (no trailing
      # boundary) covers where / where's / wheres.
      not: ['\border (status|number|tracking)\b', '\btrack(ing)?\b', '\bwhere',
            '\beta\b', '\bshipp(ed|ing)\b', '\bstatus\b']
    steps:
      - do: "scripts/state.py resume --workspace {ws}"
        why: "STOP if any gate is stale or freshness-unknown: ordering a design
              whose gates predate the last edit is the fab-truth failure class"
      - do: "scripts/report_gen.py --workspace {ws}"
        why: "the design doc is what the human approves against"
      - do: "scripts/order_quote.py --pcb {pcb} --parts {parts} --qty {qty} --out {ws}/fab/quote.json"
        why: "estimated:true always - transcribed headline prices, never a quote"
      - do: "scripts/order_submit.py --pcb {pcb} --fab-dir {fab} --qty {qty} --out {ws}/fab/order.json"
        why: "assembles the manifest + human_steps; with AIEE_JLCPCB_* creds
              --api adds upload + API DFM audit + real calculate"
      - human: 3
        why: "H5: quote row, API audit findings, order.json, human_steps (upload
              zip, JLCDFM second opinion, CPL polarity eyeball, pay)"
      - note: "Only AFTER approval, and only the orchestrator (never an agent):
               order_submit.py --api-create --confirm \"<board> <N>pcs <grand>\".
               One latched order per workspace, design-hash bound. 4-layer boards
               are the WEB path - the API refuses them."
      - recipe: track
        why: "poll status at checkpoints once an order exists"

  # -------------------------------------------------------------------------
  track:
    summary: Check the status of an order already placed.
    doc: reference/recipes/track.md
    workspace: required
    edit_class: null
    gates: []
    human_hold: 0
    preconditions: [workspace]
    match:
      any: ['\border (status|number|tracking|progress)\b',
            '\b(status|where|eta|when)\b.*\border\b', '\btracking\b',
            '\btrack\b.*\b(order|board|shipment|pcb)\b',
            '\bshipp(ed|ing)\b', '\bhas (it|my board) shipped\b', '\bfab status\b']
      not: ['\bcopper\b', '\btrace\b', '\bnet\b']
    steps:
      - do: "scripts/order_track.py --workspace {ws} --out {ws}/fab/tracking.json"
        why: "reads the latched order number from fab/order.json; exit 0 even when
              the status is unchanged"
      - note: "Web-created orders (every 4-layer board) may not be visible to the
               API at all - report what the file says and point at the JLC page."
      - do: "scripts/state.py log --workspace {ws} --event order_status --data {work}/status.json"
        why: "milestones belong in the audit trail; event names are [a-z0-9_-]{1,32}"
        optional: true

  # -------------------------------------------------------------------------
  resume-phase:
    summary: Pick a run back up where it stopped - the state file decides, not
      memory.
    doc: reference/recipes/resume-phase.md
    workspace: required
    edit_class: null
    gates: []
    human_hold: 0
    preconditions: [workspace]
    match:
      any: ['\bresume\b', '\bcontinue\b', '\bpick (it|this|the run) up\b',
            '\bcarry on\b', '\bwhere (did|were) (we|you|i)\b', '\bnext (step|phase|gate)\b',
            '\bkeep going\b', '\bfinish (the|this) (run|board|design)\b']
    steps:
      - do: "scripts/state.py resume --workspace {ws}"
        why: "phase, gates_passed, gates_passed_fresh, gates_stale,
              gates_freshness_unknown, human_hold_pending, next_gate, open issues"
      - do: "scripts/state.py log --workspace {ws} --event resumed"
        why: "the audit trail must show the seam"
      - note: "Never redo a gate that is passed AND fresh - its artifacts are
               committed. Re-run exactly the stale/unknown ones."
      - note: "Open issues in status `fixing` have work orders on disk - re-dispatch
               those rather than re-clustering from scratch."
      - recipe: full-run
        why: "re-enter the pipeline at the phase state.json reports"

  # -------------------------------------------------------------------------
  full-run:
    summary: The whole pipeline, brief to order-ready package. A recipe like any
      other - the phases are its steps.
    doc: reference/recipes/full-run.md
    workspace: created
    edit_class: null
    gates: [erc, place, drc_routed, verify, dfm]
    human_hold: 3
    match:
      any: ['\bdesign (me )?an?\b', '\bbuild (me )?an?\b', '\bnew (board|design|project)\b',
            '\bfrom scratch\b', '\bfull (run|pipeline)\b', '\bend[- ]to[- ]end\b',
            '\bwhole pipeline\b', '\bmake me an?\b.*\bboard\b', '\bspin (up )?an?\b.*\bboard\b']
      not: ['\bfootprint\b', '\bsymbol\b']
      weight: 1
    steps:
      - do: "scripts/check_env.py"
        why: "exit 0 required; on failure present its remediation strings and stop"
      - do: "scripts/state.py init --workspace {ws} --board {board}"
        why: "workspace + subdirs, in-repo so gate commits work; copy the brief in"
      - note: "P0-P10 are the recipe body: reference/recipes/full-run.md carries the
               per-phase agent roster, the checkpoints and the sim legs."
      - gate: erc
      - gate: place
      - gate: drc_routed
      - gate: verify
      - gate: dfm
      - recipe: order
        why: "P10 is the `order` recipe - same steps, same H5, same latch"
