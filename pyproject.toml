[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "smoke: live-toolchain smoke tests (need KiCad installed; slower)",
    "net: live-network tests (hit the JLCPCB/EasyEDA APIs; need internet)",
    "kicad_recorded: asserts numbers recorded on KiCad 10.0.3; skipped on any other kicad-cli (tests/conftest.py)",
]
