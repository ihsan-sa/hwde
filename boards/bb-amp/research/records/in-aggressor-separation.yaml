envelope:
  vout_v: {min: 1}
  vsig_mv: {max: 100}
maturity: draft
generalizes: []
envelope_note: >-
  Scales with the ratio of aggressor to victim: the isolation needed is the
  error budget divided by the output swing, and that swing is the input
  times the forward gain. Bounded below at 1 V of output swing, because
  under it the output is not the dominant aggressor and the supply entry is.
  Bounded at 100 mV of full-scale differential input, because above that the
  required coupling ratio is unremarkable and ordinary routing hygiene
  covers it; microvolt-to-millivolt inputs are what force the separation,
  the unbroken reference and the placement.
