envelope_note: >-
  The leakage error is the parasitic current times the impedance of the node
  it lands on, so node impedance is the one dim that decides which technique
  governs. Bounded at 1 Mohm: below it (bridge, thermocouple, strain-gauge
  sources at hundreds of ohms) even the humid-board 1 Gohm parasitic gives
  sub-microvolt errors and SYMMETRY of the two paths buys the accuracy; at
  and above 1 Mohm the same parasitic is a first-order divider and an
  actively driven guard, not symmetry, is the prescribed technique. Humidity
  moves the parasitic three decades, so this is a design-condition bound.
