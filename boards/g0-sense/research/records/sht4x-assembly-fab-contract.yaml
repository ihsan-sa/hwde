id: sht4x-assembly-fab-contract
classes:
- constraints-emission
applies:
  topologies:
  - sht4x
  packages: []
  interfaces: []
  parts: []
rule:
  enforced_by: null
  board_wash: false
  solder_paste: no-clean type 3 or higher
  reflow_profile: IPC/JEDEC J-STD-020, IR/convection
  reflow_peak_c_max: 260
  reflow_time_above_255c_s_max: 30
  solder_cycles_max: 3
  vapor_phase: not recommended without compatibility qualification
  manual_soldering: not recommended
  rework_s_max: 5
  rework_c_max: 350
  msl: 1
prose: 'Assembly constraints the block must emit into the fab/order package. HI
  p1 Key Instructions (read visually): ESD protection mandatory; no polyethylene
  antistatic bags; do not apply board wash; no spray on an unprotected sensor; avoid
  VOCs and cleaning agents; cover the sensing element during coating. HI p4 sec
  2 + Fig 1 profile: reflow per IPC/JEDEC J-STD-020, peak 260 C for up to 30 s above
  255 C, TL below 220 C under 150 s, ramp-up under 3 C/s, ramp-down under 6 C/s,
  IR/convection ovens; footnote 5: vapor-phase soldering may not be recommended
  - needs a compatibility qualification if unavoidable. HI p5: no-clean type >=3
  paste strongly recommended since it eliminates the board wash ''which can be harmful
  to the sensors'' (Instruction 4 figure: crossed-out wash bottle over a PCB); max
  3 solder cycles per sensor, assemble in the LAST cycle; paste stand-off 50-75
  um; manual soldering not recommended, rework limited to 5 s at up to 350 C; post-reflow
  RH offset -1 to -2 pct RH self-clears in 1-3 days (set test limits accordingly);
  no mechanical force on the package; conformal coating must be high-viscosity and
  never enter the sensor opening, else use the protective-cover variant. MSL1, process
  within 1 year (DS p14 sec 5.1). Emission: order notes must state no board wash,
  no-clean paste, standard IR/convection reflow only.'
sources:
- file: research/sources/HT_Handling_Instructions_SHTxx.pdf
  page: 1
  note: Key Instructions bullet list incl. 'Do not apply board wash', ESD mandatory,
    no PE bags, cover during coating; doc applies to all SHTxx
- file: research/sources/HT_Handling_Instructions_SHTxx.pdf
  page: 4
  note: 'sec 2 Assembly + Fig 1 J-STD-020 profile: peak 260 C <= 30 s above 255
    C, TL<220 C tL<150 s, ramps <3 / <6 C/s; footnote 5 vapor phase disclaimer'
- file: research/sources/HT_Handling_Instructions_SHTxx.pdf
  page: 5
  note: no-clean type >=3 paste, Instruction 4 no-board-wash figure, max 3 solder
    cycles / last cycle, 50-75 um stand-off, rework 5 s at 350 C, -1..-2 pct RH
    post-reflow offset, MSL1 1 year, coating rules
- file: research/sources/HT_DS_Datasheet_SHT4x.pdf
  page: 14
  note: 'sec 5.1 Package Description: MSL 1 per IPC/JEDEC J-STD-020, process within
    one year of delivery'
status: active
