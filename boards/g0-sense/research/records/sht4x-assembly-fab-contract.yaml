verification: {by: "second-reader", date: "2026-08-27", note: "Spot-checked seven of the listed claims individually on their own pages, all hold. HI p1 Key Instructions verbatim: 'Do not apply board wash', 'Protection against ESD is mandatory', 'Do not use polyethylene antistatic bags', 'Do not apply spray to an unprotected sensor', 'Avoid exposing the sensor to VOCs', 'Cover the sensing element during coating'; doc applicable to all SHTxx. HI p4 sec 2 + Fig 1 caption: 'Tp <= 260 degC and tp <= 30 sec above 255 degC for Pb-free assembly. TL < 220 degC and tL < 150 sec. Ramp-up rate <3 degC and ramp-down rate <6 degC/sec' in IR/Convection ovens - the record's 260 C / 30 s pair is correctly bound to 'above 255 C', not to peak dwell. Vapor phase: footnote 5 says 'may not be recommended ... it is advised that the end-user or a qualified party conducts a compatibility qualification' - the prose preserves the 'may'; the rule field's flat 'not recommended without compatibility qualification' is a fair machine encoding, not an overreach. HI p5: 'no clean type >=3 solder paste is strongly recommended as it eliminates the need for a board wash, which can be harmful to the sensors' (record keeps 'strongly recommended'); footnote 6 'Max. 3 solder cycles per sensor' + 'assembling in the last solder cycle'; 'Manual soldering is not recommended, and rework soldering should be limited to five seconds at up to 350 degC'; stand-off 50-75 um; -1..-2 pct RH post-reflow offset clearing in one to three days; MSL 1 per IPC/JEDEC J-STD-020, process within 1 year - also confirmed independently at DS p14 sec 5.1. Instruction 4 figure confirmed by eye (wash bottle over a PCB, red crossed circle). Level principle is correct here under this schema's definition (level+envelope are one decision; an emission contract carries no quantity varying with the operating point) - it matches the library's own buck-constraints-emission precedent, so a vendor handling instruction at 'principle' is not a level error."}
