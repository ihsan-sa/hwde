verification: {by: "second-reader", date: "2026-08-27", note: "DG p8 sec 3 re-read visually: text is verbatim 'In extreme cases such as at 90 %RH, a deviation of 1 degC will result in a deviation of the humidity signal of 5 %RH' - the record keys the 5 to 90 pct RH in the rule field, so the figure is not restated outside its condition. 'more severe and most common source of temperature deviations' + 'Mostly it occurs through the PCB' are exact quotes; mitigations (sufficient distances, trough milling/etching slits, metal connections as thin as possible, flex workaround) all on the page. Fig 8 panels confirmed by eye: a) thin connections + distance green check, b) white milled slits green check, c) thick/unnecessary metal red X, d) heat source in close proximity red X - matches the record panel-for-panel. DG p11 sec 3.3 verbatim 'as isolated as possible and as exposed to the environment as possible', Fig 11 a thin PCB connection / b milled slits / c flex confirmed. Level principle with no envelope is correct per schema (nothing bounds it)."}
