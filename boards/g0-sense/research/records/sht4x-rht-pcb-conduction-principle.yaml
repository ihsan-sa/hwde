id: sht4x-rht-pcb-conduction-principle
classes:
- thermal
applies:
  topologies:
  - sht4x
  packages: []
  interfaces: []
  parts: []
rule:
  enforced_by: null
  dominant_heat_path: pcb-copper-conduction
  rh_error_pct_per_degc_at_90pct_rh: 5
prose: 'PCB copper conduction, not air, is the dominant path carrying board self-heat
  into an RH/T sensor die. Design Guide sec 3 (p8, read visually): external heat
  sources raise the sensed temperature and depress the RH reading; in the extreme
  case at 90 pct RH a 1 degC deviation produces a 5 pct RH error - RH error is ~5x
  the temperature error at high humidity. Heat conduction from nearby sources (power
  electronics, microprocessors, displays) is called ''the more severe and most common
  source of temperature deviations'' and ''mostly it occurs through the PCB''. Named
  mitigations: sufficient distance, removal of unnecessary metal around the sensor
  (trough milling or etching slits), and keeping metal connections on the PCB as
  thin as possible. Fig 8 panels: a) thin metal connections + distance = good; b)
  milled slits (white lines) around the sensor decrease conduction = good; c) thick
  metal connections = bad; d) heat source in close proximity = bad. DG sec 3.3 (p11):
  rule of thumb - implement the sensor as isolated from the device and as exposed
  to the environment as possible, best with ambient airflow; Fig 11 shows the three
  decoupling options: thin PCB connection tongue, milled slits, or a flex. States
  mechanism and direction only; nothing bounds it, so it is a principle.'
