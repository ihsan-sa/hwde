rule:
  enforced_by: null
  rp_min_sensor_ohm: 390
  rp_min_i2c_3ma_at_3v3_ohm: 970
  rp_recommended_cabled_400khz_ohm: 1500
  rp_max_at_cb_200pf_ohm: 1770
  rp_max_formula: trise / (0.8473 x Cb)
  trise_fast_mode_ns: 300
