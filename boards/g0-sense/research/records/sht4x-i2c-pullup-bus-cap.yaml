prose: 'Pull-up sizing for a sensor I2C bus that leaves the board on a cable (Qwiic/STEMMA-QT,
  ~0.5 m). Floor: UM10204 p50 Eq 2, Rp(min) = (VDD - VOL(max)) / IOL with the spec
  sink of 3 mA at VOL 0.4 V for VDD > 2 V (Table 10, p43): at 3.3 V that is (3.3-0.4)/3
  mA ~ 970 ohm for interop with any compliant device. The SHT4x''s own laxer floor
  is 390 ohm at VDD >= 1.62 V (DS Table 4, p9). Ceiling: UM10204 p50 Eq 1, Rp(max)
  = tr / (0.8473 x Cb); tr max is 1000 ns Standard, 300 ns Fast, 120 ns Fm+ and
  Cb max 400 pF (Table 11, p44). Application: Cb is the TOTAL of traces, pins, cable
  and downstream device, and the ceiling must hold at the TOP of the Cb budget -
  at 400 kHz Eq 1 is Rp(max)[kohm] ~ 354/Cb[pF]: 2.36 k at 150 pF but only 1.77
  k at 200 pF. For a ~0.5 m cable plus one remote node (150-200 pF budget) fit ~1.5
  kohm: Eq 1 then holds to ~236 pF, margin over the whole budget, and it stays above
  the 970 ohm floor (~1.9 mA sink at 3.3 V). Re-derive 354/Cb for a different cable
  length rather than copying the value; past ~365 pF the 400 kHz window closes against
  the 970 floor entirely; a 100 kHz-only bus relaxes the ceiling ~3.3x (tr 1000
  ns). Fit the pull-ups once, at the host board; do not duplicate them on downstream
  nodes. Neither Sensirion nor the connector ecosystem publishes a pF/m figure for
  the Qwiic cable - estimate, then verify rise time at bring-up. DS p3 Fig 1 shows
  10 kohm pull-ups: valid only for a short single-device bus, too high once a cable
  is added.'
