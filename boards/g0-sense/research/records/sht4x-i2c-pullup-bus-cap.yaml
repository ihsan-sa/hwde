envelope:
  vin_v:
    min: 2.0
    max: 3.6
envelope_note: 'The floor assumes the 3 mA / 0.4 V VOL row, valid for VDD > 2 V
  (UM10204 Table 10; SHT4x Table 4 likewise gives the 0.4 V VOL row only for VDD
  > 2.0 V) - below 2 V a different VOL/IOL row applies and the floor must be re-derived;
  the rise-time ceiling formula itself holds at any VDD. The upper bound is the
  sensor''s, not the bus spec''s: SHT4x Table 4 (p9) caps VDD at 3.6 V and VIH max
  at VDD, so a bus this sensor sits on may not run above 3.6 V.'
maturity: verified
generalizes: []
verification: {by: "second-reader", date: "2026-08-27", note: "Re-derived Eq 1 independently from UM10204 p50 (sec 7.1, resistive pull-up; T=0.8473RC from the 0.3/0.7 VDD thresholds): Rp(max)=tr/(0.8473*Cb) with tr=300ns gives 354.1/Cb[pF] kohm - 2.36k at 150pF, 1.770k at 200pF (rule field 1770 exact), and 1.5k holds to 236.1pF. p44 Table 11 confirms tr max 1000/300/120 ns and Cb max 400/400/550 pF; p43 Table 10 confirms VOL1 0.4V at 3mA sink for VDD>2V, so Eq 2 floor = (3.3-0.4)/3mA = 967 ohm (record rounds up to 970, conservative for a floor) and 1.5k sinks 1.93mA - clears it, and clears the SHT4x 390 ohm floor (DS p9 Table 4, VDD>=1.62V). 1.5k is inside the whole declared 150-200pF window (allowed band at 200pF is 0.97-1.77k) with ~18pct ceiling headroom; the old 2.2k defect (ceiling breached above 161pF) is gone. 365pF window-close and 3.3x Sm relaxation both check out. New envelope max 3.6V is supported by DS p9 Table 4 (VDD max 3.6, VIH max = VDD). DS p3 Fig 1 does show 10k pull-ups plus 100nF as claimed."}
