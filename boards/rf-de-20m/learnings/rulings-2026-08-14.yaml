    status: promoted
    kind: root_learnings
    level: L3
    targets: [scripts/lib/geom.py]
    reason: >-
      Measurement rule - a routing corridor is the minimum perpendicular
      gap along the path, not the largest inscribed straight strip. The wrong
      measure was off by 1.8x and nearly condemned a routable board.
    triage:
      now: L0
      target: L3
      owner: scripts/lib/geom.py
      status: open
      note: >-
        geom already owns the polygon layer, so a corridor_width(obstacles,
        path) helper makes the correct measure the default one and retires the
        largest-inscribed-rectangle reflex. Three other open geom rows want the
        same module.

  # --- P7 routing ----------------------------------------------------------
  - entry: 2026-08-08-a-kicad-dru-rule-beats-a-zone
    status: promoted
    kind: root_learnings
    level: L2
    targets: [scripts/planes_gen.py, scripts/plane_repair.py]
    reason: >-
      Measured both directions on the same run - SetLocalClearance only
      ever LOOSENS a zone against nets no custom rule names, so a per-net DRU
      clearance can leave a pour unable to reach its own pads at any zone
      setting.
    triage:
      now: L0
      target: L2
      owner: scripts/plane_repair.py
      status: open
      note: >-
        Predictable from the rule set rather than discovered from a fill -
        for each zone net compare its pads' applicable DRU clearance against
        the geometry and report pads no pour can ever attach (they need a track
        or a via). Measured 0.8006 mm standoff against a 0.35 mm zone setting.

  - entry: 2026-08-08-a-via-added-into-an-already-filled
    status: promoted
    kind: root_learnings
    level: L2
    targets: [scripts/route_edit.py, scripts/stitch_vias.py]
    reason: >-
      KiCad re-derives a via's net from connectivity, so a via dropped
      into an already-filled zone takes the ZONE's net - invisible until a
      power net needs a bridge on a layer the plane owns.
    triage:
      now: L0
      target: L2
      owner: scripts/route_edit.py
      status: open
      note: >-
        route_edit already post-verifies and rolls back atomically, so the
        cost is a retry, not a board. The fix is build order (power-net vias on
        the unfilled board, pour GND, stitch, pour power last) - route_edit
        could refuse an add_via whose layer carries a filled zone of another
        net and say why.

  - entry: 2026-08-08-u201-s-outh-outl-fan-out-is
    status: declined
    kind: board_local
    reason: >-
      Fan-out geometry for one driver package and one mirrored-leg
      requirement. Its consequence (the wrap that enclosed its own pins) is
      promoted as a router prompt line.

  - entry: 2026-08-08-never-hand-krt-a-plane-carried-net
    status: promoted
    kind: root_learnings
    level: L3
    targets: [scripts/route_auto.py, scripts/route_critical.py]
    reason: >-
      route_auto derives the KRT net list from DRC unconnected items,
      which includes plane-carried GND - one open pad burned an 1800 s budget.
      A plane net that reads unconnected means this pad needs a via, not route
      this net.
    triage:
      now: L0
      target: L3
      owner: scripts/route_auto.py
      status: open
      note: >-
        Two mechanical rules. Exclude nets carried by a zone from the
        mop-up net list (route_critical already skips them by design, the KRT
        leg does not), and keep HV clearance OUT of the netclasses - pass it in
        --net-clearances, or KRT tries to route 0.4 mm-pitch signals at 0.8 mm
        and produces nothing.

  - entry: 2026-08-08-re-generating-the-schematic-wipes-rules-gen
    status: promoted
    kind: root_learnings
    level: L3
    targets: [scripts/schlib.py, scripts/rules_gen.py]
    reason: >-
      schlib.write_project writes a whole minimal .kicad_pro from
      scratch, so any post-P5 schematic regeneration deletes rules_gen's
      netclasses - and nothing re-runs rules_gen, so the DSN handed to
      Freerouting carries no per-net widths or clearances at all.
    triage:
      now: L0
      target: L3
      owner: scripts/schlib.py
      status: open
      note: >-
        write_project should MERGE net_settings and
        board.design_settings.rules rather than replace the file - the
        keep-it-minimal rationale only covers keys KiCad rejects. Cheap
        interim, and it is in the P7 recipe now - check net_settings at P7
        start and re-run rules_gen (verified byte-identical .kicad_dru).

  - entry: 2026-08-08-krt-route-py-does-not-scale-to
    status: promoted
    kind: root_learnings
    level: L1
    targets: [scripts/route_auto.py]
    reason: >-
      Measured ceiling - on a 120x80 mm board KRT cannot finish ONE
      5-connection net at any grid, even with every pour removed, so route_auto
      has no working fallback once Freerouting wedges.
    triage:
      now: L0
      target: L1
      owner: scripts/route_auto.py
      status: open
      note: >-
        Board area and grid are known before the pass, so report the
        search-space estimate and refuse with advice above the measured ceiling
        instead of spending 1800-3000 s to learn it. The zone-free run is what
        proves it is search space and not copper.

  - entry: 2026-08-08-freerouting-s-dsn-reader-wedges-on-a
    status: promoted
    kind: root_learnings
    level: L3
    targets: [scripts/route_auto.py, scripts/lib/routelib.py, reference/remediations/track_width.md]
    reason: >-
      Bisected toolchain defect with a JFR profile naming the method -
      FR 2.2.4 wedges on wires whose width rivals their length, which is
      exactly the pour fan-in that remediations/track_width.md step 4 mandates.
      The skill's own advice arms the trap for the next phase.
    triage:
      now: L0
      target: L3
      owner: scripts/lib/routelib.py
      status: open
      note: >-
        Supersedes the 2026-07-23 guess (FR wedges on KRT guide-wire
        copper) with a bisected cause. Mechanical fix - thin the DSN of every
        wire with width/length >= 0.8 before handing it to Freerouting and
        filter the SES back afterwards (the copper stays on the real board).
        Detection is cheap too: a healthy run prints Job started ~1.5 s in, so
        a missing line inside 90 s IS the wedge.

  - entry: 2026-08-08-importspecctrases-replaces-the-board-s-wiring-it
    status: promoted
    kind: root_learnings
    level: L3
    targets: [scripts/lib/route_swig.py, scripts/route_edit.py]
    reason: >-
      Measured 209 tracks to 89 and unconnected 24 to 44 - route_swig's
      docstring says it adds copper only. It survives inside route_auto solely
      because the DSN echoes every existing track back; a thinned DSN or a
      filtered SES makes the import destructive.
    triage:
      now: L0
      target: L3
      owner: scripts/lib/route_swig.py
      status: open
      note: >-
        Fix the docstring, and convert a session to route_edit ops
        (additive, atomic, post-verified) whenever the SES is not a full echo.
        SES geometry for the converter - resolution um 10 means 1 unit is
        0.1 um and y is Specctra-up, so board_y_mm = -y/10000.

  - entry: 2026-08-08-per-net-dru-clearances-never-reach-freerouting
    status: promoted
    kind: root_learnings
    level: L2
    targets: [scripts/route_auto.py, scripts/route_critical.py]
    reason: >-
      KiCad writes DSN clearances from the netclasses only, so per-net
      .kicad_dru HV rules are invisible to Freerouting - and raising the
      netclasses to compensate re-wedges the reader. There is no way to give FR
      this board's real clearances.
    triage:
      now: L0
      target: L2
      owner: scripts/route_auto.py
      status: open
      note: >-
        The consequence is a post-route repair pass, not a router setting -
        route at netclass values, then check every HV-adjacent leg against the
        .kicad_dru and fix it with route_edit (2 legs of 15 nets here). A
        post-route per-net clearance audit belongs in the P7 chain, since DRC
        only reports it after the fact.

  - entry: 2026-08-08-the-outl-wrap-around-u201-is-a
    status: promoted
    kind: prompt_line
    level: L0
    targets: [agents/router.md]
    reason: >-
      Generalises cleanly - a track laid to preserve a mirror match or
      dodge an obstacle can ENCLOSE the pins it wraps; check reachability of
      every enclosed pad before committing the wrap, not after two nets turn
      out to be unroutable.
    artifacts: [agents/router.md]

  - entry: 2026-08-08-a-track-can-swallow-an-existing-via
    status: promoted
    kind: root_learnings
    level: L2
    targets: [scripts/route_edit.py]
    reason: >-
      Two hand-routing traps found by DRC and invisible to inspection - a
      track passing inside a via's radius steals its net (the stitched island
      goes quietly open), and hole-to-hole applies to vias you did not place.
    triage:
      now: L0
      target: L2
      owner: scripts/route_edit.py
      status: open
      note: >-
        Both are pre-flightable from the board route_edit already loads -
        scan vias_of() along the proposed lane for centre-inside-track and for
        hole-to-hole (0.4995 mm plus both radii) before applying. This board
        carries 185 vias, most auto-stitched, so pads and tracks alone are not
        enough to pick a lane.

  - entry: 2026-08-08-a-0-2-mm-signal-track-routed
    status: promoted
    kind: root_learnings
    level: L2
    targets: [scripts/check_current.py, agents/router.md]
    reason: >-
      A fine-pitch pad fed by POUR rather than by track needs its feeding
      band treated as a routing keepout - one 0.2 mm track squeezed a WCSP
      ball's band below the zone's minimum width and the ball read unconnected
      with no clearance rule firing.
    triage:
      now: L0
      target: L2
      owner: agents/router.md
      status: open
      note: >-
        Detectable after the fact (the zone stops filling and the pad reads
        unconnected against its own zone) but the useful form is preventive -
        mark pour-fed fine-pitch pads and keep tracks out of the feeding band
        by the zone's minimum width plus clearance. Neither a via nor a jumper
        could rescue this one.

  - entry: 2026-08-08-netless-pth-thermal-vias-inside-an-exposed
    status: promoted
    kind: root_learnings
    level: L3
    targets: [scripts/lib/fpfix.py, scripts/lib_pull.py]
    reason: >-
      Renumbering netless PTH holes inside an exposed pad to the EP's pad
      number clears 4 solder_mask_bridge plus 4 clearance errors at once -
      tenting cannot help, because the hole sits inside the pad's own mask
      aperture.
    triage:
      now: L0
      target: L3
      owner: scripts/lib/fpfix.py
      status: open
      note: >-
        Correct by construction at pull time - a netless thru_hole pad
        whose centre lies inside another pad's polygon takes that pad's number,
        which is also what an EP thermal via IS. Carries a second fact worth
        keeping: propagating a footprint change under a LOCKED part via
        swap_new_fp preserves neither the lock nor a moved Reference/Value
        field.

  - entry: 2026-08-08-lib-pull-project-re-normalises-every-footprint
    status: promoted
    kind: root_learnings
    level: L3
    targets: [scripts/lib_pull.py]
    reason: >-
      lib_pull --project silently rewrote both hand-built spiral
      footprints' reference positions while pulling an unrelated resistor - the
      placed copies were unaffected, so nothing DRCd differently and a later
      re-import would have moved silk onto copper.
    triage:
      now: L0
      target: L3
      owner: scripts/lib_pull.py
      status: open
      note: >-
        Scope the refdes-norm pass to the parts named in this invocation.
        The --no-refdes-norm escape hatch exists but only helps someone who
        already knows about the trap; until then, git status lib/ after any
        pull into a library with hand-built parts.

  - entry: 2026-08-08-damping-a-gate-loop-with-r-g
    status: promoted
    kind: prompt_line
    level: L0
    targets: [agents/part-sourcer.md]
    reason: >-
      The board-specific half is Class E thermal arithmetic, but the
      sourcing rule generalises - check stock AT the value you are about to
