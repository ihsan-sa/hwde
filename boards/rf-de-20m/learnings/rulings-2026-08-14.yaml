  - entry: 2026-08-08-gate-py-s-default-waiver-sidecar-path
    status: promoted
    kind: root_learnings
    level: L3
    targets: [scripts/gate.py]
    reason: >-
      Pipeline bug, verified still live at U6 - gate.py defaults the
      waiver sidecar to <input dir>/reports/, which for a board input is
      kicad/reports/, a directory no workspace has. The gate then reports 31
      failing with no waived key, which reads as never signed off.
    triage:
      now: L0
      target: L3
      owner: scripts/gate.py
      status: open
      note: >-
        gate.py already has a workspace_dir() helper that computes
        boards/<name>/ correctly - use it for the default sidecar path, and say
        in the report when no sidecar was found rather than silently omitting
        the waived key. Same silent-in-the-unsafe-direction shape as the dfm
        parts.json path.

  - entry: 2026-08-08-root-py-rewrites-decoupling-json-from-scratch
    status: promoted
    kind: root_learnings
    level: L3
    targets: [scripts/schlib.py, scripts/check_decoupling.py]
    reason: >-
      Second instance of the generator-owns-this-file trap - a schematic
      regeneration rewrites decoupling.json from the sheets'
      place_ic_with_decoupling calls, deleting hand-added rail associations and
      re-opening a check_pdn error on copper that never changed.
    triage:
      now: L0
      target: L3
      owner: scripts/schlib.py
      status: open
      note: >-
        Same fix shape as the .kicad_pro netclass wipe - merge rather than
        replace, or emit the generated associations into a file the
        hand-authored one extends. A rail whose decouplers hang off a
        regulator OUTPUT node has no IC load pin at all, so the generator can
        never emit those entries and they will always be hand-added.

  - entry: 2026-08-08-a-schematic-field-only-edit-costs-15
    status: promoted
    kind: root_learnings
    level: L2
    targets: [scripts/board_update.py, scripts/gate.py]
    reason: >-
      A comment-only generator edit produces an electrically identical
      netlist and still costs 15 footprint_symbol_field_mismatch findings,
      because KiCad footprints carry their own copy of the schematic fields and
      drc_routed folds in parity.
    triage:
      now: L0
      target: L2
      owner: scripts/board_update.py
      status: open
      note: >-
        Rule for every recipe that regenerates a sheet - kc.py netlist plus
        board_update before the DRC baseline means anything. The cheap tell is
        a non-zero parity source in gate-drc_routed.json; board_update
        classifies the fix as swap_same_fp with value null and syncs fields
        only (positions, tracks, vias, zones and locks all byte-identical here).

