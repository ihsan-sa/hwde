  # --- P8 verification and simulation --------------------------------------
  - entry: 2026-08-08-pour-neck-tests-one-zone-at-a
    status: promoted
    kind: root_learnings
    level: L2
    targets: [scripts/check_current.py]
    reason: >-
      The entry says it itself - skill-level, promote with the numbers.
      pour_neck erodes one zone's fill at a time and only where two vias land,
      so it missed a 2.295 mm bottleneck and flagged a 3.16 mm neck in copper
      carrying zero current.
    triage:
      now: L1
      target: L2
      owner: scripts/check_current.py
      status: open
      note: >-
        Three defects - per-zone instead of per-net, via-gated sampling,
        and no parallel-path label (undersized_track has a bridge label,
        pour_neckdown has nothing). The workspace bus solver that replaced it
        is ~60 lines of scipy on lib/geom and ran in 8 s on a 120x80 mm board,
        finding a 10.4 mOhm/369 mW bus the gate scored as one stub neck.
        Corollary worth its own check: a single 0.2 mm signal track laid across
        a poured power bus severs it silently.

  - entry: 2026-08-08-the-via-takes-the-zone-s-net
    status: promoted
    kind: root_learnings
    level: L2
    targets: [scripts/route_edit.py]
    reason: >-
      Extends the P7 via/zone trap - with 3 of 4 layers agreeing with the
      op it still fails, and fails differently each attempt, so inside the fill
      is necessary but not sufficient.
    triage:
      now: L0
      target: L2
      owner: scripts/route_edit.py
      status: open
      note: >-
        The reliable procedure is cheaper than it looks - strip every
        filled_polygon block (paren-matched, outlines stay), apply the ops on
        the unfilled board, then refill. You do not need a bare board, you need
        the FILLS gone. Second-order: KiCad derives the net from the via
        CENTRE, so test net_copper(net, layer).contains(via.at).

  - entry: 2026-08-08-two-p8-checks-whose-window-not-whose
    status: promoted
    kind: root_learnings
    level: L2
    targets: [scripts/check_thermal.py, scripts/check_silk.py, scripts/silk_place.py]
    reason: >-
      Two P8 checks whose WINDOW, not whose model, produces the finding -
      check_thermal counts vias inside a radius smaller than the array it
      demands, and check_silk's attribution rule can be geometrically
      unsatisfiable, so the scripted fix is not always available.
    triage:
      now: L1
      target: L2
      owner: scripts/check_thermal.py
      status: open
      note: >-
        check_thermal's window is max(2.0, sqrt(pad_hull/pi) + 1.5) - 2.27
        mm for an EPC2019, while the board carries 9 vias within 4.0 mm of each
        centroid. Scale the window to the requested via count or to the pad
        hull plus array pitch. check_silk half - run the feasibility search
        before promising a move (zero legal positions for R203 here, 3 for
        C202).

  - entry: 2026-08-08-k-x-trace-width-makes-a-pour
    status: promoted
    kind: root_learnings
    level: L2
    targets: [scripts/check_return_path.py]
    reason: >-
      check_return_path buffers a centreline by k x width, which is the
      wrong model for the short full-width land track that track_width.md step
      4 mandates - 27 percent of the reported deficit ran off the board
      entirely, and the check never looked at the pour where the loop lives.
    triage:
      now: L1
      target: L2
      owner: scripts/check_return_path.py
      status: open
      note: >-
        Aspect-ratio guard - when a track's width >= its length the
        corridor is a modelling artefact, so skip it and measure the POUR
        instead (corridor_on reads tracks_of only; the /SW pour measured 96.13
        percent imaged). Same construct as the Freerouting wedge and the pour
        fan-in remediation, so all three want one track-class label.

  - entry: 2026-08-08-checked-pairs-min-gap-mm-null-is
    status: promoted
    kind: root_learnings
    level: L2
    targets: [scripts/gate.py, scripts/check_creepage.py]
    reason: >-
      check_creepage already proves the negative - a null min_gap_mm
      means nothing on that layer for that net pair is even within the largest
      applicable requirement - and gate.py keeps only the failing list, so the
      evidence never reaches the reviewer.
    triage:
      now: L0
      target: L2
      owner: scripts/gate.py
      status: open
      note: >-
        Carry the checked[] summary (or a distilled proved-clean list) into
        the gate JSON - it turned a 21-finding audit into three non-null rows
        in one read. Companion facts for the reviewer: violation records carry
        item/other_item type (pad/track/via/zone), and _same_fp downgrades only
        pad-to-pad, so an error count is not a count of layout defects.

  - entry: 2026-08-08-ten-machine-verified-traps-from-authoring-the
    status: promoted
    kind: root_learnings
    level: L2
    targets: [scripts/lib/simlib.py, scripts/sim_run.py, agents/sim-analyst.md]
    reason: >-
      Ten reproduced ngspice traps from authoring a real bench, each of
      which cost a debug cycle - .meas has no two-node form, vp() returns
      radians, .step silently reports only its last point through sim_run, and
      tight tolerances kill a power deck.
    triage:
      now: L0
      target: L2
      owner: scripts/lib/simlib.py
      status: open
      note: >-
        At least four are mechanical - reject v(a,b) and
        subcircuit-internal i() inside .meas at lint time, refuse or fold .step
        (parse_measures overwrites earlier points), and warn on abstol/reltol
        overrides on a power deck. The rest (behavioural Coss without abs(),
        ESR on lumped copper, measurement windows in time constants) are
        sim-analyst prompt lines.

  - entry: 2026-08-08-a-zone-with-no-return-plane-is
    status: promoted
    kind: root_learnings
    level: L2
    targets: [scripts/check_return_path.py, scripts/sim_run.py]
    reason: >-
      Any net leaving a planed zone loses its microstrip inductance model
      at the boundary - free-space partial self-inductance was 7x the
      microstrip estimate here, and the resulting 30 nH took output power from
      121 W to 53 W on a board that was DRC-clean, verify-clean and fab-ready.
    triage:
      now: L0
      target: L2
      owner: scripts/check_return_path.py
      status: open
      note: >-
        check_return_path already knows which segments are unimaged - hand
        P8 the partial-inductance number for those segments the way route-notes
        already reports pour capacitance. Tuning corollary that is easy to get
        backwards: extra series L is cancelled by LESS series C, not more.

  - entry: 2026-08-08-nonlinear-coss-makes-zvs-bus-dependent-which
    status: declined
    kind: board_local
    reason: >-
      Class E ZVS behaviour against this FET's nonlinear Coss. It
      retires a mitigation inside this board's own decision record and has no
