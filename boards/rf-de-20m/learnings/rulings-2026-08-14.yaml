  - entry: 2026-08-09-gate-py-gate-dfm-looks-for-parts
    status: promoted
    kind: root_learnings
    level: L3
    targets: [scripts/gate.py, reference/invalidation.yaml]
    reason: >-
      Pipeline bug, verified still live at U6 - run_dfm looks for
      parts.json beside the board while every workspace keeps its BOM of record
      at parts/parts.json, so the BOM-completeness leg never ran and the gate
      reported a clean pass having never looked at the BOM.
    triage:
      now: L0
      target: L3
      owner: scripts/gate.py
      status: open
      note: >-
        U2's strict mode turns the missing-parts case into a coverage
        failure rather than a silent pass, but the PATH is still
        kicad/parts.json in gate.py run_dfm and in invalidation.yaml (so the
        parts artifact hashes null on every workspace). Resolve it through
        statelib.kind_path like every other artifact.

  - entry: 2026-08-09-board-level-via-tenting-does-not-protect
    status: promoted
    kind: root_learnings
    level: L2
    targets: [scripts/dfm_check.py, scripts/lib/gerblib.py]
    reason: >-
      KiCad tenting means it does not GENERATE a mask aperture for the
      via; it does not SUBTRACT the via from another pad's aperture. 30 vias
      were bare inside pad openings and 17 open at both ends on a board whose
      board-level tenting was yes and whose per-via overrides were zero.
    triage:
      now: L0
      target: L2
      owner: scripts/dfm_check.py
      status: open
      note: >-
        Provable from the shipped package rather than from the board -
        enumerate the mask gerber's openings and account for every one
        (via-in-pad, and via-in-pad open on BOTH faces). gerblib already parses
        the apertures. Reading the board's tenting setting proves nothing about
        the files that get fabricated, which is the statement a fab package
        needs to make.

  - entry: 2026-08-09-hole-plated-is-always-true-on-kicad
    status: promoted
    kind: root_learnings
    level: L3
    targets: [scripts/lib/gerblib.py, scripts/dfm_check.py]
    reason: >-
      gerbonara does not surface plating on KiCad's merged drill export,
      so all 326 holes read plated True - including the declared np_thru_hole
      mounting holes - and dfm_check.check_annular_ring gates on exactly that
      flag.
    triage:
      now: L0
      target: L3
      owner: scripts/lib/gerblib.py
      status: open
      note: >-
        The truth is in the drill file's TA.AperFunction comments
        (Plated,PTH,ViaDrill vs NonPlated,NPTH,ComponentDrill) carried per
        TOOL - parse them in _holes instead of getattr(obj, plated, True).
        Latent consequence until then: an NPTH hole placed inside a real SMD
        pad produces a phantom annular-ring error with no way to see why.
