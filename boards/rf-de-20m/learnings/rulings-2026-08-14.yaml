  - entry: 2026-08-08-constraints-rects-are-consumed-as-absolute-board
    status: promoted
    kind: root_learnings
    level: L2
    targets: [scripts/planes_gen.py, scripts/constraints_lint.py]
    reason: >-
      Pipeline defect - planes_gen._region_rect and placelib._forbidden
      read constraints rects as absolute while board_init does not place the
      outline at the origin, so a declared plane can silently land on nothing
      or on top of the part it must avoid.
    triage:
      now: L0
      target: L2
      owner: scripts/constraints_lint.py
      status: open
      note: >-
        Root entry 221 covers placement.keepouts (placelib); this adds the
        planes[].region consumer, where the failure is a board that DRCs clean
        with no plane where you thought you had one. constraints_lint does not
        know the outline - give it board_init.json.outline_bbox and lint every
        rect's frame, or make the frame explicit in the schema. Third rule from
        the same entry: after the P7 pour, verify each plane net's island count
        - the fill is the authority, not the planned rectangle.

