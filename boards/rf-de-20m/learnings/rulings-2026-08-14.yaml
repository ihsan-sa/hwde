  # --- P4 schematic-era findings ------------------------------------------
  - entry: 2026-08-08-ti-s-2-ohm-at-each-output
    status: promoted
    kind: root_learnings
    level: L2
    targets: [scripts/netlist_audit.py]
    reason: >-
      Per-pin driver floors multiply with paralleled devices - arithmetic
      over a net that no ERC, netlist_audit or check_ sees, and on an eGaN part
      the consequence of getting it wrong is destruction on the first pulse.
    triage:
      now: L0
      target: L2
      owner: scripts/netlist_audit.py
      status: open
      note: >-
        With N devices on one driver pin each branch must be >= N x the
        datasheet floor; here 4 x 3R9 read as 0.975 ohm against a 2 ohm floor
        while every individual leg looked compliant. Needs the floor in
        parts.json (datasheet_extract) plus a per-driver-pin parallel sum in
        netlist_audit. Second-order and worth carrying with it - the gate-loop
        inductance budget scales as R^2.

  - entry: 2026-08-08-type-3-ripple-injection-raises-the-dc
    status: promoted
    kind: knowledge_record
    level: L0
    targets: [reference/knowledge/records/cot-ripple-injection-raises-vout.yaml]
    reason: >-
