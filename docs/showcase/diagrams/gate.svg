<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 553 188" width="553" height="188" font-family="'Source Serif 4', 'Source Serif Pro', Georgia, serif" role="img">
<title>Every stage ends at its checks and a person's sign-off</title>
<defs><marker id="dg-a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8.5" markerHeight="8.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 L2.6,5 Z" fill="#77716A"/></marker><marker id="dg-a-hot" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9.5" markerHeight="9.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 L2.6,5 Z" fill="#9C4221"/></marker></defs>
<rect fill="#FAF8F3" width="553" height="188"/>
<g transform="translate(8.5,8)">
<path class="dg-e" fill="none" stroke="#77716A" stroke-width="1.1" stroke-linejoin="round" d="M104,29 L142.5,29" marker-end="url(#dg-a)"/>
<path class="dg-e" fill="none" stroke="#77716A" stroke-width="1.1" stroke-linejoin="round" d="M248,29 L286.5,29" marker-end="url(#dg-a)"/>
<path class="dg-e" fill="none" stroke="#77716A" stroke-width="1.1" stroke-linejoin="round" d="M392,29 L430.5,29" marker-end="url(#dg-a)"/>
<path class="dg-e fail" fill="none" stroke="#9C4221" stroke-width="1.1" stroke-linejoin="round" d="M196,58 L196,112.5" marker-end="url(#dg-a-hot)"/>
<path class="dg-e fail" fill="none" stroke="#9C4221" stroke-width="1.1" stroke-linejoin="round" d="M340,58 L340,112.5" marker-end="url(#dg-a-hot)"/>
<path class="dg-e dash" fill="none" stroke="#77716A" stroke-width="1.1" stroke-linejoin="round" stroke-dasharray="3.5 3" d="M144,143 L58,143 Q52,143 52,137 L52,59.5" marker-end="url(#dg-a)"/>
<rect class="dg-n work" stroke-width="1.1" fill="#ECEFEB" stroke="#5E7A5A" x="0" y="0" width="104" height="58" rx="3"/><text class="dg-t" font-size="14" font-weight="600" fill="#15140F" x="52" y="25.5" text-anchor="middle">Stage</text><text class="dg-s" font-size="11.33" fill="#4A4740" x="52" y="41.5" text-anchor="middle">writes a file</text>
<rect class="dg-n gate" stroke-width="1.1" fill="#F3E8E4" stroke="#9C4221" x="144" y="0" width="104" height="58" rx="3"/><text class="dg-t" font-size="14" font-weight="600" fill="#15140F" x="196" y="25.5" text-anchor="middle">Checks</text><text class="dg-s" font-size="11.33" fill="#4A4740" x="196" y="41.5" text-anchor="middle">run on it</text>
<rect class="dg-n actor" stroke-width="1.1" fill="#F4EFE6" stroke="#A07A2C" x="288" y="0" width="104" height="58" rx="3"/><text class="dg-t" font-size="14" font-weight="600" fill="#15140F" x="340" y="25.5" text-anchor="middle">Sign-off</text><text class="dg-s" font-size="11.33" fill="#4A4740" x="340" y="41.5" text-anchor="middle">by a person</text>
<rect class="dg-n neutral" stroke-width="1.1" fill="#F0EADE" stroke="#77716A" x="432" y="7" width="104" height="44" rx="3"/><text class="dg-t" font-size="14" font-weight="600" fill="#15140F" x="484" y="33.5" text-anchor="middle">Next stage</text>
<rect class="dg-n neutral" stroke-width="1.1" fill="#F0EADE" stroke="#77716A" x="144" y="114" width="248" height="58" rx="3"/><text class="dg-t" font-size="14" font-weight="600" fill="#15140F" x="268" y="139.5" text-anchor="middle">Fix loop</text><text class="dg-s" font-size="11.33" fill="#4A4740" x="268" y="155.5" text-anchor="middle">reworks the file</text>
<text class="dg-l" font-size="11.33" font-style="italic" fill="#4A4740" paint-order="stroke" stroke="#FAF8F3" stroke-width="5" stroke-linejoin="round" x="268" y="22" text-anchor="middle">pass</text>
<text class="dg-l" font-size="11.33" font-style="italic" fill="#4A4740" paint-order="stroke" stroke="#FAF8F3" stroke-width="5" stroke-linejoin="round" x="412" y="22" text-anchor="middle">pass</text>
<text class="dg-l hot" font-size="11.33" font-style="italic" fill="#9C4221" paint-order="stroke" stroke="#FAF8F3" stroke-width="5" stroke-linejoin="round" x="204" y="90" text-anchor="start">fail</text>
<text class="dg-l hot" font-size="11.33" font-style="italic" fill="#9C4221" paint-order="stroke" stroke="#FAF8F3" stroke-width="5" stroke-linejoin="round" x="348" y="90" text-anchor="start">fail</text>
</g>
