# HIDDEN known-answer for e2e_usbc_ldo: what a working USB-C 5 V sink + 3.3 V
# LDO at 300 mA must have, from the datasheets' typical applications.  Read by
# evals/e2e_electrical.py only; never shown to a design run (the repo is not
# in the sandbox).
brief: e2e_usbc_ldo
operating:
  vin_min: 4.75          # USB 2.0 VBUS at the receptacle
  vin_max: 5.25
  vout: 3.3
  iout_a: 0.30           # the brief's "up to 300 mA"
  t_ambient_c: 25
  tj_max_c: 125
# USB Type-C spec, sink Rd: 5.1k +/-10% on EACH CC pin, separately
cc_rd_ohm: [4590, 5610]
pins:                    # pin-function regexes, matched to the symbol's names
  cc1: "CC1"
  cc2: "CC2"
  vbus: "VBUS"
  ldo_vin: "VIN|VI|IN|INPUT"
  ldo_vout: "VOUT|VO|OUT|OUTPUT"
  ldo_gnd: "GND|ADJ/GND|VSS|EP|PAD"
  ldo_en: "EN|CE|ON|SHDN|EN/SHDN|~SHDN"
# per-LDO datasheet numbers (first match on value/lib/MPN wins); cin/cout are
# the minimum capacitance the datasheet's stability section asks for
ldos:
  - {match: "AMS1117|LM1117|AZ1117|LD1117", cin_min_uf: 10, cout_min_uf: 22, iout_max_a: 0.8, dropout_v: 1.3}
  - {match: "AP2114", cin_min_uf: 1, cout_min_uf: 1, iout_max_a: 1.0, dropout_v: 0.4}
  - {match: "AP2112", cin_min_uf: 1, cout_min_uf: 1, iout_max_a: 0.6, dropout_v: 0.4}
  - {match: "AP7361|AP7365", cin_min_uf: 1, cout_min_uf: 1, iout_max_a: 1.0, dropout_v: 0.4}
  - {match: "XC6206", cin_min_uf: 1, cout_min_uf: 1, iout_max_a: 0.2, dropout_v: 0.25}
  - {match: "XC6210|XC6220", cin_min_uf: 1, cout_min_uf: 1, iout_max_a: 0.7, dropout_v: 0.1}
  - {match: "ME6211|RT9013", cin_min_uf: 1, cout_min_uf: 1, iout_max_a: 0.5, dropout_v: 0.25}
  - {match: "MCP1700", cin_min_uf: 1, cout_min_uf: 1, iout_max_a: 0.25, dropout_v: 0.18}
  - {match: "MCP1826|MCP1825", cin_min_uf: 4.7, cout_min_uf: 4.7, iout_max_a: 1.0, dropout_v: 0.25}
  - {match: "TLV757|TLV758", cin_min_uf: 1, cout_min_uf: 0.47, iout_max_a: 1.0, dropout_v: 0.4}
  - {match: "LDL1117", cin_min_uf: 1, cout_min_uf: 4.7, iout_max_a: 1.2, dropout_v: 0.35}
  - {match: "", cin_min_uf: 1, cout_min_uf: 1, iout_max_a: null, dropout_v: 0.5}   # unknown part
# junction-to-ambient by package, JEDEC board, matched on the footprint name
theta_ja:
  - {match: "SOT-?223", c_per_w: 90}
  - {match: "TO-?252|DPAK", c_per_w: 60}
  - {match: "SOT-?89", c_per_w: 130}
  - {match: "SOT-?23", c_per_w: 250}
  - {match: "SC-?70|SOT-?323|SOT-?353", c_per_w: 350}
  - {match: "DFN|QFN|SON", c_per_w: 100}
  - {match: "", c_per_w: 200}
decap_max_mm: 5
trace_a: {vbus: 0.5, vout: 0.3}
